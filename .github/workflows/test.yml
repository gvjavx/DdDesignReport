name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # each system reports its own result
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Go formatting and vet
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: Go tests
        run: go test ./...

      - name: Build the binary
        shell: bash
        run: |
          go build -o ddreport${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/ddreport
          # on Windows the path must be D:/a/..., which Node can start a program from, not /d/a/...
          echo "DDREPORT_BIN=$(pwd -W 2>/dev/null || pwd)/ddreport${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"
      - name: Node.js wrapper
        run: node --test node/test.js
      - name: Java wrapper
        shell: bash
        run: |
          javac -encoding UTF-8 -d out java/io/ddreport/DdReport.java java/DdReportTest.java
          java -Dfile.encoding=UTF-8 -cp out DdReportTest

  # the designer in the three browser engines: Chromium (Chrome, Edge), Firefox and WebKit (Safari)
  designer:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to a new release on its own schedule
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Designer tests in Chromium, Firefox and WebKit
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit
          node designer/run-tests.mjs
