<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DdDesignReport designer tests</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px }
  li.fail { color: #b00020; font-weight: 600 }
  #host { position: absolute; left: -9999px; top: 0; width: 1400px }
</style>
</head>
<body>
<h1>Designer tests</h1>
<p>Open this page through a web server (for example <code>npx serve designer</code>, then <code>/test.html</code>). It drives the designer with synthetic events and lists what failed.</p>
<p id="summary" role="status">running…</p>
<ul id="log"></ul>
<div id="host"></div>
<script type="module">
import { createDesigner, emptyTemplate } from './designer.js'

const host = document.getElementById('host'), log = document.getElementById('log')
let failed = 0, total = 0
const check = (name, ok, detail = '') => {
  total++
  if (!ok) failed++
  const li = log.appendChild(document.createElement('li'))
  li.className = ok ? 'ok' : 'fail'
  li.textContent = (ok ? '✓ ' : '✗ ') + name + (ok || !detail ? '' : ' — ' + detail)
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b)
// clipboard events made by a script carry their data in Chromium and Safari, not in Firefox;
// where they do not, the clipboard checks are skipped (real Ctrl+C and Ctrl+V work there)
const clipboardWorks = (() => {
  try { const d = new DataTransfer(); d.setData('text/plain', 'x'); return new ClipboardEvent('paste', { clipboardData: d }).clipboardData?.getData('text/plain') === 'x' } catch { return false }
})()

// a fresh designer for every test
function open(template, options = {}) {
  host.replaceChildren(document.createElement('div'))
  const root = host.firstChild
  let last
  const d = createDesigner(root, { template, onChange: t => { last = t }, ...options })
  const q = s => root.querySelector(s), qa = s => [...root.querySelectorAll(s)]
  return {
    d, root, q, qa,
    get tpl() { return d.getTemplate() },
    get last() { return last },
    els: band => d.getTemplate().bands[band].elements,
    click: cmd => q(`[data-cmd="${cmd}"]`).click(),
    set(sel, v) { const c = q(sel); if (c.type === 'checkbox') c.checked = v; else c.value = v; c.dispatchEvent(new Event('change', { bubbles: true })) },
    drop(type, band, x, y) {
      const dt = new DataTransfer(), b = q(`.ddr-band[data-name=${band}]`), r = b.getBoundingClientRect()
      dt.setData('text/plain', type)
      b.dispatchEvent(new DragEvent('drop', { dataTransfer: dt, bubbles: true, cancelable: true, clientX: r.left + x, clientY: r.top + y }))
    },
    ptr: (n, type, x, y, o = {}) => n.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 1, clientX: x, clientY: y, ...o })),
    key: (k, o = {}) => (root.contains(document.activeElement) ? document.activeElement : q('.ddr-page')).dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...o })),
    prop(label, v) {
      const input = qa('.ddr-props label').find(l => l.firstChild.textContent === label).querySelector('input,select,textarea')
      input.value = v
      input.dispatchEvent(new Event('input', { bubbles: true }))
      input.dispatchEvent(new Event('change', { bubbles: true }))
    },
    drag(n, dx, dy, o = {}) {
      const r = n.getBoundingClientRect(), x = r.left + 4, y = r.top + 4
      this.ptr(n, 'pointerdown', x, y); this.ptr(n, 'pointermove', x + dx, y + dy, o); this.ptr(n, 'pointerup', x + dx, y + dy)
    },
  }
}
// double-clicking makes the element, or the box of words inside it, editable: that is where typing goes
const editable = node => (node.dispatchEvent(new MouseEvent('dblclick', { bubbles: true })), node.querySelector('[contenteditable=true],[contenteditable=plaintext-only]') ?? node)
const edit = (node, html) => { const box = editable(node); box.innerHTML = html; box.dispatchEvent(new FocusEvent('blur')) }

const tests = {
  'starts with an empty A4 page and seven bands'() {
    const t = open()
    check('seven bands', t.qa('.ddr-band').length === 7)
    check('A4', t.tpl.page.width === 595 && t.tpl.page.height === 842)
    check('undo is disabled at the start', t.q('[data-cmd=undo]').disabled)
  },
  'inserts every kind of element'() {
    const t = open()
    for (const type of ['text', 'table', 'rect', 'line', 'chart', 'barcode']) t.click('add:' + type)
    check('six elements', same(t.els('header').map(e => e.type), ['text', 'table', 'rect', 'line', 'chart', 'barcode']))
    const at = t.els('header').map(e => e.x + ',' + e.y)
    check('new elements do not land exactly on top of each other', new Set(at).size === at.length, at.join(' '))
    t.drop('text', 'detail', 30, 4)
    check('drop puts the element where it was dropped', same(t.els('detail').map(e => [e.x, e.y]), [[30, 4]]))
  },
  'formats text from the ribbon'() {
    const t = open()
    t.click('add:text')
    t.set('[data-prop=font]', 'Times'); t.set('[data-prop=fontSize]', 16); t.click('bold'); t.click('italic'); t.click('align:center')
    t.set('[data-prop=color]', '#ff0000'); t.set('[data-prop=fill]', '#ffff00'); t.set('[data-prop=lineHeight]', '1.5'); t.set('[data-prop=grow]', true)
    const e = t.els('header')[0]
    check('properties saved', e.font === 'Times' && e.fontSize === 16 && e.bold && e.italic && e.align === 'center' && e.color === '#ff0000' && e.fill === '#ffff00' && e.lineHeight === 1.5 && e.grow, JSON.stringify(e))
    check('buttons show the state', t.q('[data-cmd=bold]').getAttribute('aria-pressed') === 'true' && t.q('[data-cmd="align:center"]').getAttribute('aria-pressed') === 'true')
    t.click('noFill')
    check('no fill', t.els('header')[0].fill === '')
  },
  'types in place, with styled parts and literal tags'() {
    const t = open()
    t.click('add:text')
    edit(t.q('.ddr-el'), 'Hello <i>world</i><br>two <b>x</b>')
    check('rich text is saved as tags', t.els('header')[0].text === 'Hello <i>world</i>\ntwo <b>x</b>', t.els('header')[0].text)
    const node = t.q('.ddr-el')
    const box = editable(node); box.textContent = 'type <b> literally'; box.dispatchEvent(new FocusEvent('blur'))
    check('a typed "<b>" stays text', t.els('header')[0].text === 'type &lt;b> literally' && t.q('.ddr-el').textContent === 'type <b> literally' && !t.q('.ddr-el b'), t.els('header')[0].text)
  },
  'Escape throws the typing away'() {
    const t = open()
    t.click('add:text')
    const node = t.q('.ddr-el')
    const box = editable(node)
    box.textContent = 'never mind'
    box.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
    box.dispatchEvent(new FocusEvent('blur'))
    check('text unchanged', t.els('header')[0].text === 'Text' && t.q('.ddr-el').textContent === 'Text', t.els('header')[0].text)
  },
  'edits tables'() {
    const t = open()
    t.q('[data-tab=Insert]').click()
    t.set('[data-id=rows]', 1); t.set('[data-id=cols]', 4); t.drop('table', 'detail', 0, 0)
    check('1 x 4 table', same(t.els('detail')[0].cells, [['', '', '', '']]))
    const cell = t.qa('.ddr-cell')[2]
    const box = editable(cell); box.textContent = '{{price:2}}'; box.dispatchEvent(new FocusEvent('blur'))
    const c = t.qa('.ddr-cell')[2].getBoundingClientRect()
    t.ptr(t.qa('.ddr-cell')[2], 'pointerdown', c.left + 2, c.top + 2); t.ptr(t.q('.ddr-el'), 'pointerup', c.left + 2, c.top + 2)
    t.click('align:right')
    check('cell text and column alignment', t.els('detail')[0].cells[0][2] === '{{price:2}}' && same(t.els('detail')[0].aligns, ['left', 'left', 'right', 'left']), JSON.stringify(t.els('detail')[0]))
    t.prop('columns', 5); t.prop('column widths', '3,1,1')
    check('columns and widths from the panel', t.els('detail')[0].cells[0].length === 5 && same(t.els('detail')[0].cols, [3, 1, 1, 1, 1]))
  },
  'moves, snaps and changes band'() {
    const t = open()
    t.drop('rect', 'summary', 5, 5); t.drop('rect', 'summary', 300, 5)
    const second = t.qa('.ddr-band[data-name=summary] .ddr-el')[1]
    t.drag(second, -172, 0)
    check('snaps to the edge of its neighbour', t.els('summary')[1].x === 125, 'x=' + t.els('summary')[1].x)
    t.drag(t.qa('.ddr-band[data-name=summary] .ddr-el')[1], 40, 0, { altKey: true })
    check('Alt turns snapping off', t.els('summary')[1].x === 165, 'x=' + t.els('summary')[1].x)
    const el = t.qa('.ddr-band[data-name=summary] .ddr-el')[0], r = el.getBoundingClientRect(), into = t.q('.ddr-band[data-name=detail]').getBoundingClientRect()
    t.ptr(el, 'pointerdown', r.left + 4, r.top + 4); t.ptr(el, 'pointermove', r.left + 4, into.top + 6, { altKey: true }); t.ptr(el, 'pointerup', r.left + 4, into.top + 6)
    check('dragging into another band moves it there', t.els('detail').length === 1 && t.els('summary').length === 1)
    check('the band grew to hold it', t.tpl.bands.detail.height >= t.els('detail')[0].y + t.els('detail')[0].h)
  },
  'keeps elements on the paper'() {
    const t = open()
    t.click('add:rect')
    t.prop('from left', 5000); t.prop('from top', 300)
    const e = t.els('header')[0]
    check('x is limited to the printable width', e.x === 523 - e.w, 'x=' + e.x)
    check('the band grows instead of letting the element spill out', t.tpl.bands.header.height === 300 + e.h, 'height=' + t.tpl.bands.header.height)
  },
  'copies, pastes, selects several and arranges'() {
    const t = open()
    t.drop('rect', 'summary', 5, 5); t.click('copy')
    check('paste is enabled after copy', !t.q('[data-cmd=paste]').disabled)
    t.click('paste'); t.click('paste')
    check('three copies, each a step further', same(t.els('summary').map(e => [e.x, e.y]), [[5, 5], [15, 15], [25, 25]]))
    const nodes = t.qa('.ddr-band[data-name=summary] .ddr-el')
    t.ptr(nodes[0], 'pointerdown', 0, 0, { shiftKey: true }); t.ptr(nodes[1], 'pointerdown', 0, 0, { shiftKey: true })
    check('shift-click adds to the selection', t.qa('.ddr-sel').length === 3)
    t.click('arrange:x:0'); t.click('arrange:y:0')
    check('aligned', same(t.els('summary').map(e => [e.x, e.y]), [[5, 5], [5, 5], [5, 5]]))
    t.click('delete')
    check('delete removes all selected', t.els('summary').length === 0)
  },
  'selects with a dragged box'() {
    const t = open()
    t.drop('rect', 'header', 10, 5); t.drop('rect', 'header', 200, 5); t.drop('rect', 'summary', 10, 2)
    const band = t.q('.ddr-band[data-name=header]'), b = band.getBoundingClientRect(), page = t.q('.ddr-page')
    t.ptr(band, 'pointerdown', b.left + 400, b.top + 2); t.ptr(page, 'pointermove', b.left + 5, b.top + 50)
    check('the box is drawn', !!document.querySelector('.ddr-marquee')) // on the page itself, not in the designer
    t.ptr(page, 'pointerup', b.left + 5, b.top + 50)
    check('two elements selected', t.qa('.ddr-sel').length === 2)
    check('the keyboard stays with the designer', t.root.contains(document.activeElement))
    t.key('Delete')
    check('Delete removes what the box selected', t.els('header').length === 0 && t.els('summary').length === 1)
    t.ptr(band, 'pointerdown', b.left + 500, b.top + 2); t.ptr(page, 'pointerup', b.left + 500, b.top + 2)
    check('a click on empty paper selects nothing', t.qa('.ddr-sel').length === 0)
  },
  'keyboard keeps working after a delete'() {
    const t = open()
    t.click('add:text'); t.click('add:rect')
    const node = t.q('.ddr-el[data-type=text]')
    node.focus(); t.ptr(node, 'pointerdown', 0, 0); t.ptr(node, 'pointerup', 0, 0)
    t.key('Delete')
    check('deleted', t.els('header').length === 1)
    check('focus is still inside the designer', t.root.contains(document.activeElement), document.activeElement.tagName)
    t.key('z', { ctrlKey: true })
    check('Ctrl+Z brings it back', t.els('header').length === 2)
    t.key('y', { ctrlKey: true })
    check('Ctrl+Y deletes it again', t.els('header').length === 1)
  },
  'nudges with the arrow keys'() {
    const t = open()
    t.drop('rect', 'summary', 50, 0)
    const node = t.q('.ddr-el'); node.focus(); t.ptr(node, 'pointerdown', 0, 0); t.ptr(node, 'pointerup', 0, 0)
    t.key('ArrowRight', { shiftKey: true }); t.key('ArrowLeft')
    check('moved 10 right and 1 back', t.els('summary')[0].x === 59, 'x=' + t.els('summary')[0].x)
    t.key('ArrowUp')
    check('cannot leave the band at the top', t.els('summary')[0].y === 0)
  },
  'replacing the template can be undone'() {
    const t = open()
    t.click('add:text')
    t.d.setTemplate()
    check('empty after setTemplate', t.els('header').length === 0)
    check('undo is available', !t.q('[data-cmd=undo]').disabled)
    t.click('undo')
    check('undo restores the previous report', t.els('header').length === 1)
  },
  'page layout'() {
    const t = open()
    t.set('[data-id=paper]', 'Letter'); t.set('[data-id=orientation]', 'Landscape'); t.set('[data-page=marginLeft]', 50)
    t.set('[data-page=background]', '#eef6ff'); t.set('[data-tpl=groupBy]', 'category'); t.set('[data-tpl=groupPageBreak]', true)
    const p = t.tpl.page
    check('paper, orientation, margin, background', p.width === 792 && p.height === 612 && p.marginLeft === 50 && p.background === '#eef6ff', JSON.stringify(p))
    check('grouping', t.tpl.groupBy === 'category' && t.tpl.groupPageBreak === true)
    check('the page is drawn that way', t.q('.ddr-page').style.width === '792px' && t.q('.ddr-page').style.paddingLeft === '50px')
    t.click('noBackground')
    check('background removed', t.tpl.page.background === '')
  },
  'zoom keeps positions in points'() {
    const t = open()
    t.click('zoom:1'); t.click('zoom:1')
    check('120%', t.q('[data-id=zoom]').value === '120%')
    // at 150% the page's margin is a whole number of pixels, so browsers that round a
    // made-up mouse position to a pixel (Firefox, Safari) land where the check expects
    t.click('zoom:1'); t.click('zoom:1'); t.click('zoom:1')
    t.drop('rect', 'summary', 60, 6)
    check('a drop at 60px on screen is 40pt on paper', t.els('summary')[0].x === 40, 'x=' + t.els('summary')[0].x)
    t.click('zoom:0')
    check('back to 100%', t.q('[data-id=zoom]').value === '100%')
  },
  'band height by its bottom edge'() {
    const t = open()
    const grip = t.q('.ddr-band[data-name=detail] .ddr-grip'), r = grip.getBoundingClientRect()
    t.ptr(grip, 'pointerdown', r.left + 5, r.top); t.ptr(grip, 'pointermove', r.left + 5, r.top + 15); t.ptr(grip, 'pointerup', r.left + 5, r.top + 15)
    check('15pt taller', t.tpl.bands.detail.height === 35, 'height=' + t.tpl.bands.detail.height)
  },
  'loads templates that are damaged or old'() {
    const cases = {
      'table without cells': { bands: { header: { height: 40, elements: [{ type: 'table', x: 0, y: 0, w: 50, h: 20 }] } } },
      'elements is not a list': { bands: { header: { height: 40, elements: 'oops' } } },
      'elements with junk in it': { bands: { header: { height: 40, elements: [null, 7, 'x', { type: 'text' }] } } },
      'band is null': { bands: { header: null } },
      'an array': [1, 2, 3],
      'a string': 'hello',
      'page is a string': { page: 'A4' },
      'numbers as text': { page: { width: '400', height: 'tall' }, bands: { detail: { height: '25', elements: [{ type: 'rect', x: '10', y: null, w: '30', h: 'x' }] } } },
      'unknown element type': { bands: { header: { height: 40, elements: [{ type: 'hologram', x: 0, y: 0, w: 50, h: 20 }] } } },
    }
    for (const [name, template] of Object.entries(cases)) {
      try {
        const t = open(template)
        const first = t.q('.ddr-el')
        if (first) { t.ptr(first, 'pointerdown', 0, 0); t.ptr(first, 'pointerup', 0, 0) }
        check(name, t.qa('.ddr-band').length === 7 && t.qa('.ddr-props label').length > 0)
      } catch (err) { check(name, false, err.message) }
    }
    const t = open(cases['numbers as text'])
    check('text numbers become numbers', t.tpl.page.width === 400 && t.tpl.page.height === 842 && t.tpl.bands.detail.height === 40 && same(t.els('detail').map(e => [e.x, e.y, e.w, e.h]), [[10, 0, 30, 40]]), JSON.stringify(t.tpl.bands.detail))
    check('an unknown element survives a round trip', open(cases['unknown element type']).els('header')[0].type === 'hologram')
    const old = open({ page: { width: 595, height: 842, margin: 20 } })
    check('one old margin becomes four', same(['marginTop', 'marginRight', 'marginBottom', 'marginLeft'].map(s => old.tpl.page[s]), [20, 20, 20, 20]))
  },
  'resizes with the corner handle'() {
    const t = open()
    t.drop('rect', 'summary', 20, 0)
    const h = t.q('.ddr-handle')
    check('a selected element has a handle on its corner', !!h && h.style.left === '140px' && h.style.top === '40px', h && h.style.left + ',' + h.style.top)
    t.ptr(h, 'pointerdown', 100, 100); t.ptr(h, 'pointermove', 140, 115); t.ptr(h, 'pointerup', 140, 115)
    check('40 wider and 15 taller', t.els('summary')[0].w === 160 && t.els('summary')[0].h === 55, JSON.stringify(t.els('summary')[0]))
    check('the band grew with it', t.tpl.bands.summary.height === 55)
    t.click('zoom:1'); t.click('zoom:1'); t.click('zoom:1'); t.click('zoom:1'); t.click('zoom:1')
    const z = t.q('.ddr-handle')
    t.ptr(z, 'pointerdown', 100, 100); t.ptr(z, 'pointermove', 130, 100); t.ptr(z, 'pointerup', 130, 100)
    check('at 150% a 30px drag is 20pt', t.els('summary')[0].w === 180, 'w=' + t.els('summary')[0].w)
    t.drop('line', 'footer', 0, 5)
    const l = t.q('.ddr-handle')
    t.ptr(l, 'pointerdown', 100, 100); t.ptr(l, 'pointermove', 130, 160); t.ptr(l, 'pointerup', 130, 160)
    check('a line only changes its length', t.els('footer')[0].w === 220 && t.els('footer')[0].h === 1, JSON.stringify(t.els('footer')[0]))
    t.ptr(t.qa('.ddr-el')[0], 'pointerdown', 0, 0, { shiftKey: true })
    check('no handle while several are selected', !t.q('.ddr-handle'))
  },
  'guides a first-time user and reports what is selected'() {
    const t = open()
    check('an empty page says how to start', !!t.q('.ddr-hint'))
    check('status shows the paper', t.q('[data-id=status]').textContent === 'A4 · 595 × 842 pt', t.q('[data-id=status]').textContent)
    t.click('add:rect')
    check('the hint goes away', !t.q('.ddr-hint'))
    check('status and panel name the selection', t.q('[data-id=status]').textContent.endsWith('rect 120 × 40') && t.q('[data-id=side]').textContent === 'Properties · rect')
    const range = t.q('[data-id=zoomrange]'); range.value = 200; range.dispatchEvent(new Event('input', { bubbles: true }))
    check('the zoom slider zooms', t.q('[data-id=zoom]').value === '200%')
    t.click('zoom:fit')
    check('fit to width', t.q('[data-id=zoom]').value !== '200%' && parseInt(t.q('[data-id=zoom]').value) >= 25, t.q('[data-id=zoom]').value)
    check('every ribbon button has a name for screen readers', t.qa('.ddr-b').every(b => b.getAttribute('aria-label')))
    check('light theme by default, dark on request', t.root.dataset.theme === 'light' && open(undefined, { theme: 'dark' }).root.dataset.theme === 'dark')
  },
  'deletes with the button on the element and by dragging to the bin'() {
    const t = open()
    t.drop('rect', 'summary', 20, 0); t.drop('rect', 'summary', 200, 0)
    const x = t.q('.ddr-x')
    check('the selected element has a delete button on its top-right corner', !!x && x.style.left === '320px' && x.style.top === '0px' && !!x.getAttribute('aria-label'), x && x.style.left + ',' + x.style.top)
    x.click()
    check('the button deletes that element only', same(t.els('summary').map(e => e.x), [20]))
    check('the keyboard still works afterwards', t.root.contains(document.activeElement))
    t.click('undo')
    check('undo brings it back', t.els('summary').length === 2)

    const bin = t.q('.ddr-trash'), node = t.q('.ddr-el'), r = node.getBoundingClientRect()
    check('the bin is hidden until something is dragged', bin.hidden)
    t.ptr(node, 'pointerdown', r.left + 4, r.top + 4); t.ptr(node, 'pointermove', r.left + 30, r.top + 4, { altKey: true })
    check('dragging shows the bin', !bin.hidden && !bin.classList.contains('over'))
    const b = bin.getBoundingClientRect()
    t.ptr(node, 'pointermove', b.left + 10, b.top + 10, { altKey: true })
    check('the bin lights up under the pointer', bin.classList.contains('over'))
    t.ptr(node, 'pointerup', b.left + 10, b.top + 10)
    check('dropping on the bin deletes the element', t.els('summary').length === 1 && bin.hidden)
    t.click('undo')
    check('and undo restores it where it was', same(t.els('summary').map(e => [e.x, e.y]), [[20, 0], [200, 0]]), JSON.stringify(t.els('summary').map(e => [e.x, e.y])))

    const nodes = t.qa('.ddr-el')
    t.ptr(nodes[0], 'pointerdown', 0, 0); t.ptr(nodes[0], 'pointerup', 0, 0); t.ptr(nodes[1], 'pointerdown', 0, 0, { shiftKey: true })
    check('no delete button while several are selected', !t.q('.ddr-x'))
    const r2 = nodes[0].getBoundingClientRect()
    t.ptr(nodes[0], 'pointerdown', r2.left + 4, r2.top + 4); t.ptr(nodes[0], 'pointermove', r2.left + 40, r2.top + 4, { altKey: true })
    const b2 = bin.getBoundingClientRect()
    t.ptr(nodes[0], 'pointermove', b2.left + 10, b2.top + 10, { altKey: true }); t.ptr(nodes[0], 'pointerup', b2.left + 10, b2.top + 10)
    check('dragging several to the bin deletes them all', t.els('summary').length === 0)
    const d = open(); d.drop('rect', 'summary', 20, 0)
    const n3 = d.q('.ddr-el'), r3 = n3.getBoundingClientRect()
    d.ptr(n3, 'pointerdown', r3.left + 4, r3.top + 4); d.ptr(n3, 'pointermove', r3.left + 60, r3.top + 4, { altKey: true }); d.ptr(n3, 'pointerup', r3.left + 60, r3.top + 4)
    check('a drop anywhere else just moves it', d.els('summary').length === 1 && d.els('summary')[0].x === 76 && d.q('.ddr-trash').hidden, JSON.stringify(d.els('summary')))
  },
  'keeps the page in the middle of the work area'() {
    const t = open()

  async 'preview'() {
    let finish
    const t = open(undefined, { preview: () => new Promise(r => { finish = r }) })
    const dialog = t.q('.ddr-preview'), frame = t.q('.ddr-preview iframe'), status = t.q('.ddr-preview [role=status]'), alert = t.q('.ddr-preview [role=alert]')

    t.q('.ddr-status [data-cmd=preview]').click()
    const note = t.q('.ddr-sheet [role=alert]'), loaded = () => new Promise(r => frame.addEventListener('load', r, { once: true }))
    check('opens at once and says it is rendering', dialog.open && note.textContent === 'Rendering…' && !frame.classList.contains('ready'))
    finish('<!doctype html><html><head><style></style></head><body><div class="p"></div><div class="p"></div></body></html>')
    await new Promise(r => setTimeout(r))
    check('counts the pages', status.textContent === '2 pages', status.textContent)
    check('fits the page into the frame', /body\{padding:12px 0;zoom:(1|0\.\d+)\}/.test(frame.srcdoc), frame.srcdoc.slice(0, 200))
    if (!frame.classList.contains('ready')) await loaded()
    check('the frame shows once its document has loaded', frame.classList.contains('ready'))
    const same = '<!doctype html><html><head></head><body><div class="p"></div></body></html>'
    t.click('preview')
    check('hidden again while the next one renders', !frame.classList.contains('ready'))
    finish(same); await loaded()
    t.click('preview')
    finish(same); await loaded()
    check('an unchanged report still reloads and shows', frame.classList.contains('ready'))
    t.click('preview')
    const slow = finish
    t.click('preview')
    const fast = finish
    fast('<html><head></head><body><div class="p"></div></body></html>'); slow('<html><head></head><body><div class="p"></div><div class="p"></div><div class="p"></div></body></html>')
    await new Promise(r => setTimeout(r))
    check('a slow earlier render does not overwrite a later one', status.textContent === '1 page', status.textContent)
    dialog.close()
    const bad = open(undefined, { preview: async () => { throw new Error('no server') } })
    bad.click('preview')
    await new Promise(r => setTimeout(r))
    const err = bad.q('.ddr-sheet [role=alert]')
    check('shows the error in the middle, in red, with no frame over it', err.textContent === 'no server' && err.classList.contains('err') && !bad.q('.ddr-sheet iframe').classList.contains('ready'))
    bad.q('.ddr-preview').close()
    check('no preview option, no preview button', !open().q('[data-cmd=preview]'))
  },

    t.q('.ddr-subdialog button[value=cancel]').click()
    await new Promise(r => setTimeout(r, 50))
    check('Close leaves it as it was', e().report.bands.header.elements.length === 1)
  },
  'the system clipboard'() {
    if (!clipboardWorks) return check('skipped: this browser does not let a script fill a clipboard event', true)
    const a = open()
    a.click('add:rect')
    a.q('.ddr-el').focus()
    const data = new DataTransfer()
    document.dispatchEvent(new ClipboardEvent('copy', { clipboardData: data, bubbles: true, cancelable: true }))
    const text = data.getData('text/plain')
    check('copy puts the elements on the clipboard as JSON', JSON.parse(text).ddreport?.[0]?.[0] === 'header', text)
    const b = open() // another designer, as in another tab
    b.q('.ddr-page').focus()
    const paste = text => { const d = new DataTransfer(); d.setData('text/plain', text); document.dispatchEvent(new ClipboardEvent('paste', { clipboardData: d, bubbles: true, cancelable: true })) }
    paste(text)
    check('paste brings them into another designer', b.els('header').length === 1 && b.els('header')[0].type === 'rect')
    paste('Halo <b>dunia</b>')
    check('plain text becomes a text box, tags kept as text', b.els('header')[1]?.text === 'Halo &lt;b>dunia&lt;/b>', JSON.stringify(b.els('header')[1]))
  },
  'simple mode: fewer tools, each with its name'() {
    const t = open(undefined, { simple: true })
    check('marked simple', t.root.hasAttribute('data-simple'))
    check('ribbon buttons carry a short name to show', t.q('[data-cmd=undo]').dataset.label === 'Undo')
    check('Arrange and Margins are left out', t.q('[data-group=Arrange]').hidden && t.q('[data-group=Margins]').hidden)
    check('group bands wait for Group by', !t.q('.ddr-band[data-name=groupHeader]'))
    t.set('[data-tpl=groupBy]', 'category')
    check('then they show', !!t.q('.ddr-band[data-name=groupHeader]'))
    t.click('add:rect')
    const labels = t.qa('.ddr-props label').map(l => l.firstChild.textContent)
    check('no x and y, but width and height', !labels.includes('from left') && labels.includes('width') && labels.includes('height'), labels.join())
  },
  'barcodes on the page are the printed codes'() {
    // the modules a drawn code covers, read back from its rectangles
    const modules = (svg, size, module, offset, height) => {
      const out = Array.from({ length: height }, () => new Array(size).fill('0'))
      for (const r of svg.querySelectorAll('rect')) {
        const x = Math.round((+r.getAttribute('x') - offset) / module), y = height === 1 ? 0 : Math.round((+r.getAttribute('y') - offset) / module)
        for (let i = 0; i < Math.round(+r.getAttribute('width') / module); i++) out[y][x + i] = '1'
      }
      return out.map(row => row.join('')).join('')
    }
    // made by github.com/boombuler/barcode, which the renderer uses
    const HELLO = '111111100010101111111100000101110001000001101110100010101011101101110100010101011101101110101011101011101100000100111001000001111111101010101111111000000000000000000000101010100100100010010011110001001000010001000111111101001011000111101011001110101110010011110101001110101000000001010001000101111111100000100101100100000100110001101000101110101100101111111101110100011010100010101110101111011101001100000100001110001011111111101101011100001'
    const INV = '11010010000110001000101011100011011101011000100110111001011101111011001001110111001001101011110111010011011100101110111101100110110010110111000100101100001100011101011'
    const t = open({ bands: { header: { height: 120, elements: [
      { type: 'barcode', x: 0, y: 0, w: 100, h: 100, text: '{{code}}', format: 'qr' },
      { type: 'barcode', x: 120, y: 0, w: 340, h: 40, text: 'INV-2026-0142', format: 'code128', showText: true },
    ] } } }, { data: { rows: [{ code: 'HELLO WORLD' }] } })
    const [q, c] = t.qa('.ddr-el[data-type=barcode] svg')
    check('QR: the code of the sample data, module for module', modules(q, 21, 100 / 25, 200 / 25, 21) === HELLO)
    check('Code 128: the printed bars', modules(c, INV.length, 340 / INV.length, 0, 1) === INV)
    check('its text under it', c.querySelector('text')?.textContent === 'INV-2026-0142')
    check('the tooltip still shows the field', t.qa('.ddr-el[data-type=barcode]')[0].title.includes('{{code}}'))
  },
  'charts on the page have the printed value scale'() {
    const t = open({ thousands: '.', decimal: ',', bands: { summary: { height: 160, elements: [
      { type: 'chart', w: 300, h: 140, chart: 'bar', label: 'name', value: 'qty * price' },
      { type: 'chart', y: 0, x: 320, w: 200, h: 22, chart: 'pie', label: 'name', value: 'qty' },
    ] } } }, { data: [{ name: 'Kopi', qty: 2, price: 18000 }, { name: 'Teh', qty: 1, price: 12000 }, { name: 'Gula', qty: 3, price: 15000 }], lang: 'id' })
    const [bar, pie] = t.qa('.ddr-el[data-type=chart] svg'), words = svg => [...svg.querySelectorAll('text')].map(x => x.textContent)
    check('values written as the report writes them', words(bar).includes('45.000') && words(bar).includes('36.000'), words(bar).join(' | '))
    check('a scale from zero in round steps', ['0', '20.000', '40.000', '60.000'].every(v => words(bar).includes(v)), words(bar).join(' | '))
    check('a pie legend that does not fit is summed into Other', words(pie).length === 2 && words(pie)[1] === 'Other: 3', words(pie).join(' | '))
  },
  'simple mode keeps Preview'() {
    const t = open(undefined, { simple: true, preview: async () => '' })
    check('the sub-report button goes', t.q('[data-cmd="add:subreport"]').closest('.ddr-group').hidden)
    check('Preview stays in the View tab', !t.q('[data-panel=View] [data-cmd=preview]').closest('.ddr-group').hidden)
  },
  'hide leaves out tabs, groups, commands and settings'() {
    const t = open(undefined, { hide: ['Home', 'chart', 'Layout.Data', 'showIf', 'delete'] })
    check('the tab and its panel are gone', t.q('[data-tab=Home]').hidden && t.q('[data-panel=Home]').hidden)
    check('the first tab still shown is open', t.q('[data-tab=Insert]').getAttribute('aria-selected') === 'true' && !t.q('[data-panel=Insert]').hidden)
    check('the chart button is gone, from the ribbon and the start hint', t.q('[data-cmd="add:chart"]').hidden && !t.q('.ddr-hint [data-cmd="add:chart"]'))
    check('only the Data group of Layout goes', t.q('[data-panel=Layout] [data-group=Data]').hidden && !t.q('[data-panel=Insert] [data-group=Data]').hidden)
    t.click('add:rect')
    check('the property is not offered', !t.qa('.ddr-props label').some(l => l.firstChild.textContent === 'show when'))
    t.q('.ddr-el').focus()
    t.key('Delete')
    check('a hidden command does not run from its shortcut', t.els('header').length === 1)
  },
  'a toolbar of its own: run, commands, state, no ribbon'() {
    const states = []
    const t = open(undefined, { hide: ['ribbon', 'delete'], onState: st => states.push(st) })
    check('no ribbon', getComputedStyle(t.q('.ddr-tabs')).display === 'none' && t.qa('.ddr-panel').every(p => getComputedStyle(p).display === 'none'))
    check('commands lists what can run, not what is hidden', t.d.commands().includes('bold') && t.d.commands().includes('add') && !t.d.commands().includes('delete'))
    t.d.run('add:text')
    check('run adds, as the ribbon does', t.els('header').length === 1)
    check('the state says what is selected', t.d.getState().selected === 1 && t.d.getState().type === 'text' && t.d.getState().undo)
    t.d.run('bold')
    check('run formats, and onState hears it', t.els('header')[0].bold === true && states.at(-1).bold === true)
    t.d.run('align:center')
    check('align with its argument', t.els('header')[0].align === 'center' && t.d.getState().align === 'center')
    t.d.run('delete')
    check('a hidden command does not run', t.els('header').length === 1)
    let threw = false
    try { t.d.run('nothing') } catch { threw = true }
    check('an unknown command says so', threw)
    t.d.run('undo')
    check('undo from outside', !t.els('header')[0].align || t.els('header')[0].align === 'left')
  },
  'crosstab: insert, settings, what it shows'() {
    const t = open()
    t.click('add:crosstab')
    const e = () => t.els('header')[0]
    check('inserted with its defaults', e().type === 'crosstab' && e().measure === 'count()' && e().border === 1)
    t.prop('rows by', 'region')
    t.prop('columns by', 'month')
    t.prop('value', 'sum(total):2')
    check('the settings are kept', e().rowField === 'region' && e().columnField === 'month' && e().measure === 'sum(total):2')
    check('the page shows what it counts', t.q('.ddr-el').textContent.includes('region × month') && t.q('.ddr-el').textContent.includes('sum(total):2'))
    t.click('bold')
    check('the ribbon formats it as a table', e().bold === true)
  },
  'theme inherit takes the page theme (Bootstrap variables)'() {
    host.style.setProperty('--bs-primary', 'rgb(255, 0, 0)')
    host.style.setProperty('--bs-border-radius', '0px')
    host.style.setProperty('--bs-body-font-family', 'Georgia')
    const t = open(undefined, { theme: 'inherit' })
    const cs = getComputedStyle(t.root)
    check('the accent', cs.getPropertyValue('--a').trim() === 'rgb(255, 0, 0)', cs.getPropertyValue('--a'))
    check('the corners', getComputedStyle(t.q('.ddr-b')).borderTopLeftRadius === '0px')
    check('the font', cs.fontFamily.includes('Georgia'))
    for (const v of ['--bs-primary', '--bs-border-radius', '--bs-body-font-family']) host.style.removeProperty(v)
    const plain = open(undefined, { theme: 'inherit' })
    check('without Bootstrap, the usual look', getComputedStyle(plain.root).getPropertyValue('--a').trim() === '#2563eb')
  },
  'messages replace any text'() {
    const t = open(undefined, { lang: 'id', messages: { Insert: 'Tambah', 'Text box': 'Tulisan' } })
    check('own word wins', t.q('[data-tab=Insert]').textContent === 'Tambah')
    check('the rest stays Indonesian', t.q('[data-tab=Home]').textContent === 'Beranda')
    check('on buttons too', t.q('[data-cmd="add:text"] span').textContent === 'Tulisan')
  },
  'the start hint has buttons that add'() {
    const t = open()
    t.q('.ddr-hint [data-cmd="add:table"]').click()
    check('a table is on the page', t.els('header')[0]?.type === 'table')
    check('and the hint is gone', !t.q('.ddr-hint'))
  },
  'destroy lets go of the page'() {
    const t = open()
    t.click('add:rect')
    t.d.destroy()
    check('the element is empty', !t.root.children.length && !t.root.classList.contains('ddr'))
    if (!clipboardWorks) return
    const d = new DataTransfer()
    d.setData('text/plain', 'hello')
    document.dispatchEvent(new ClipboardEvent('paste', { clipboardData: d, bubbles: true, cancelable: true }))
    check('no longer listens to the clipboard', t.d.getTemplate().bands.header.elements.length === 1)
  },
  'hostile templates and clipboards cannot break it or reach out'() {
    const t = open({ page: { backgroundImage: 'https://example.com/track.png' }, bands: { header: { height: 40, elements: [
      { type: 'text', text: 5, fill: 'url(https://example.com/a.png)' }, { type: 'image', src: 'data:image/png;base64,x"), url("https://example.com/b.png' },
      { type: 'chart', label: 7, value: 3 }, { type: 'subreport', report: { bands: { detail: null } } },
    ] } } })
    check('a link as page background is not fetched', !t.q('.ddr-page').style.backgroundImage)
    const [text, image] = t.qa('.ddr-el')
    check('a fill cannot load a picture', !text.style.backgroundImage && !text.style.background.includes('url'))
    check('a picture that is not just a picture is not drawn', !image.style.backgroundImage)
    check('every element is drawn', t.qa('.ddr-el').length === 4)
    if (!clipboardWorks) return
    t.q('.ddr-page').focus()
    const d = new DataTransfer()
    d.setData('text/plain', JSON.stringify({ ddreport: [['header', '{"type":"table"}'], ['header', 'null'], ['header', '{oops']] }))
    document.dispatchEvent(new ClipboardEvent('paste', { clipboardData: d, bubbles: true, cancelable: true }))
    const els = t.els('header')
    check('a broken pasted table is repaired, the rest left out', els.length === 5 && els[4].type === 'table' && Array.isArray(els[4].cells), JSON.stringify(els.slice(4)))
  },
  'tells the host about changes, with a copy on request'() {
    const t = open()
    t.click('add:text')
    check('onChange was called with the template', t.last?.bands.header.elements.length === 1)
    const copy = t.d.getTemplate()
    copy.bands.header.elements.length = 0
    check('getTemplate returns a copy', t.els('header').length === 1)
    check('emptyTemplate is a fresh template', emptyTemplate().bands.detail.elements.length === 0)
  },
}

for (const [name, test] of Object.entries(tests)) {
  log.appendChild(document.createElement('li')).outerHTML = `<li><b>${name}</b></li>`
  try { await test() } catch (err) { check(name + ' threw', false, err.stack) }
}
host.replaceChildren()
document.getElementById('summary').textContent = failed ? `${failed} of ${total} checks FAILED` : `all ${total} checks passed`
document.title = (failed ? 'FAILED' : 'passed') + ' — designer tests'
window.result = { failed, total, failures: [...log.querySelectorAll('.fail')].map(li => li.textContent) }
</script>
</body>
</html>
