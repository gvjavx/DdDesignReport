<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DdDesignReport with Bootstrap</title>
<!-- An example: the designer inside a Bootstrap page, with a toolbar made of Bootstrap
     components. theme: 'inherit' takes Bootstrap's colours, font and corners, dark mode too;
     hide: ['ribbon'] leaves the designer's own toolbar out, and designer.run() does what its
     buttons did. Served by `ddreport -serve` at /bootstrap.html. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<style>
  html, body { height: 100% }
  body { display: flex; flex-direction: column }
  #designer { flex: 1; min-height: 0; border-radius: 0; border-width: 1px 0 0 }
</style>
</head>
<body>
<nav class="navbar bg-body-tertiary border-bottom px-2 py-1 gap-2 flex-wrap">
  <span class="navbar-brand fw-bold me-1">Laporan</span>
  <div class="btn-group btn-group-sm" role="group" aria-label="History">
    <button class="btn btn-outline-secondary" data-run="undo" title="Undo">↶</button>
    <button class="btn btn-outline-secondary" data-run="redo" title="Redo">↷</button>
  </div>
  <div class="dropdown">
    <button class="btn btn-sm btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">Insert</button>
    <ul class="dropdown-menu">
      <li><button class="dropdown-item" data-run="add:text">Text box</button></li>
      <li><button class="dropdown-item" data-run="add:table">Table</button></li>
      <li><button class="dropdown-item" data-run="add:rect">Box</button></li>
      <li><button class="dropdown-item" data-run="add:line">Line</button></li>
      <li><button class="dropdown-item" data-run="add:chart">Chart</button></li>
      <li><button class="dropdown-item" data-run="add:barcode">Barcode / QR</button></li>
      <li><hr class="dropdown-divider"></li>
      <li><button class="dropdown-item" data-run="picture">Picture…</button></li>
    </ul>
  </div>
  <div class="btn-group btn-group-sm" role="group" aria-label="Text">
    <button class="btn btn-outline-secondary fw-bold" data-run="bold" data-state="bold">B</button>
    <button class="btn btn-outline-secondary fst-italic" data-run="italic" data-state="italic">I</button>
    <button class="btn btn-outline-secondary text-decoration-underline" data-run="underline" data-state="underline">U</button>
  </div>
  <div class="btn-group btn-group-sm" role="group" aria-label="Align">
    <button class="btn btn-outline-secondary" data-run="align:left" data-align="left">Left</button>
    <button class="btn btn-outline-secondary" data-run="align:center" data-align="center">Center</button>
    <button class="btn btn-outline-secondary" data-run="align:right" data-align="right">Right</button>
  </div>
  <button class="btn btn-sm btn-outline-danger" data-run="delete" data-needs-selection>Delete</button>
  <div class="btn-group btn-group-sm ms-auto" role="group" aria-label="Zoom">
    <button class="btn btn-outline-secondary" data-run="zoom:-1">−</button>
    <button class="btn btn-outline-secondary" data-run="zoom:fit" id="zoom">100%</button>
    <button class="btn btn-outline-secondary" data-run="zoom:1">+</button>
  </div>
  <div class="form-check form-switch m-0">
    <input class="form-check-input" type="checkbox" role="switch" id="dark">
    <label class="form-check-label" for="dark">Dark</label>
  </div>
</nav>
<div id="designer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script type="module">
import { createDesigner } from './designer.js'

const designer = createDesigner(document.getElementById('designer'), {
  theme: 'inherit',  // Bootstrap's colours, font and corners, and its dark mode
  hide: ['ribbon'],  // the toolbar above takes its place
  fontBase: 'fonts/',
  // the toolbar shows what the designer has: pressed, disabled, zoom
  onState: s => {
    for (const b of document.querySelectorAll('[data-state]')) b.classList.toggle('active', s[b.dataset.state])
    for (const b of document.querySelectorAll('[data-align]')) b.classList.toggle('active', s.align === b.dataset.align)
    for (const b of document.querySelectorAll('[data-needs-selection]')) b.disabled = !s.selected
    document.querySelector('[data-run=undo]').disabled = !s.undo
    document.querySelector('[data-run=redo]').disabled = !s.redo
    document.getElementById('zoom').textContent = Math.round(s.zoom * 100) + '%'
  },
})
for (const b of document.querySelectorAll('[data-run]')) b.onclick = () => designer.run(b.dataset.run)
document.getElementById('dark').onchange = e => { document.documentElement.dataset.bsTheme = e.target.checked ? 'dark' : 'light' }
</script>
</body>
</html>
