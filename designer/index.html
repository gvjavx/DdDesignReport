<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DdDesignReport Designer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22DdDesignReport%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%232563eb%22%2F%3E%3Cpath%20d%3D%22M20%2010h16v8a3%203%200%200%200%203%203h8v30a3%203%200%200%201-3%203H20a3%203%200%200%201-3-3V13a3%203%200%200%201%203-3z%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M39%2010.6%2046.4%2018H40a1%201%200%200%201-1-1z%22%20fill%3D%22%23fff%22%2F%3E%3Cg%20fill%3D%22%232563eb%22%3E%3Crect%20x%3D%2221%22%20y%3D%2220%22%20width%3D%2211%22%20height%3D%222.6%22%20rx%3D%221.3%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%2225%22%20width%3D%2218%22%20height%3D%222.6%22%20rx%3D%221.3%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%2230%22%20width%3D%2211.5%22%20height%3D%222.6%22%20rx%3D%221.3%22%2F%3E%3Crect%20x%3D%2225%22%20y%3D%2243%22%20width%3D%223%22%20height%3D%225%22%20rx%3D%22.6%22%2F%3E%3Crect%20x%3D%2229.5%22%20y%3D%2240.5%22%20width%3D%223%22%20height%3D%227.5%22%20rx%3D%22.6%22%2F%3E%3Crect%20x%3D%2234%22%20y%3D%2238%22%20width%3D%223%22%20height%3D%2210%22%20rx%3D%22.6%22%2F%3E%3C%2Fg%3E%3Crect%20x%3D%2222%22%20y%3D%2235.5%22%20width%3D%2217.5%22%20height%3D%2214%22%20fill%3D%22none%22%20stroke%3D%22%232563eb%22%20stroke-width%3D%221.2%22%20stroke-dasharray%3D%221.5%201.5%22%2F%3E%3Crect%20x%3D%2238.2%22%20y%3D%2234.2%22%20width%3D%222.6%22%20height%3D%222.6%22%20fill%3D%22%23fff%22%20stroke%3D%22%232563eb%22%20stroke-width%3D%221%22%2F%3E%3Crect%20x%3D%2220.7%22%20y%3D%2248.2%22%20width%3D%222.6%22%20height%3D%222.6%22%20fill%3D%22%23fff%22%20stroke%3D%22%232563eb%22%20stroke-width%3D%221%22%2F%3E%3C%2Fsvg%3E">
<style>
  :root { --a: #2563eb; --surface: #fff; --bg: #f6f7f9; --text: #1f2937; --muted: #6b7280; --line: #e2e5ea; --hover: #eef2f7; color-scheme: light }
  @media (prefers-color-scheme: dark) {
    :root { --a: #7aa2ff; --surface: #1d222c; --bg: #161a22; --text: #e5e9f0; --muted: #98a2b3; --line: #303745; --hover: #272e3b; color-scheme: dark }
  }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif }
  header { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line) }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-right: 6px }
  .brand svg { width: 26px; height: 26px }
  button, select { font: inherit; color: inherit; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer }
  button:hover, select:hover { background: var(--hover) }
  button.primary { background: var(--a); border-color: var(--a); color: #fff; font-weight: 600 }
  button.primary:hover { filter: brightness(1.08); background: var(--a) }
  :is(button, select, a, summary, textarea):focus-visible { outline: 2px solid var(--a); outline-offset: 1px }
  .seg { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface) }
  .seg span { padding: 0 10px; color: var(--muted); font-size: 12px }
  .seg button { border: 0; border-left: 1px solid var(--line); border-radius: 0; padding: 0 10px; font-weight: 600; font-size: 12px }
  .spacer { flex: 1 }
  .switch { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; white-space: nowrap }
  .switch input { width: 16px; height: 16px; margin: 0; accent-color: var(--a) }
  header a { color: var(--a); text-decoration: none; font-weight: 600; white-space: nowrap }
  header a:hover { text-decoration: underline }
  #msg { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 30; max-width: min(92vw, 560px); padding: 10px 16px; border-radius: 10px; background: #1f2937; color: #fff; box-shadow: 0 8px 24px #0004; font-size: 13px }
  #msg:empty { display: none }
  #datapanel { background: var(--surface); border-bottom: 1px solid var(--line) }
  #datapanel summary { display: none }
  #datapanel > div { padding: 10px 12px 12px }
  #datapanel label { display: block; font-weight: 600; margin-bottom: 6px }
  #datapanel p { margin: 0 0 6px; color: var(--muted) }
  textarea { display: block; width: min(100%, 760px); height: 150px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: 12px/1.5 ui-monospace, Consolas, monospace }
  #designer { flex: 1; min-height: 0; border: 0; border-radius: 0 }
  @media (max-width: 640px) {
    header { padding: 6px 8px }
    .brand span { display: none }
    .spacer { display: none }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#2563eb"/><path d="M20 10h16v8a3 3 0 0 0 3 3h8v30a3 3 0 0 1-3 3H20a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3z" fill="#fff"/><path d="M39 10.6 46.4 18H40a1 1 0 0 1-1-1z" fill="#fff"/><g fill="#2563eb"><rect x="21" y="20" width="11" height="2.6" rx="1.3"/><rect x="21" y="25" width="18" height="2.6" rx="1.3"/><rect x="21" y="30" width="11.5" height="2.6" rx="1.3"/><rect x="25" y="43" width="3" height="5" rx=".6"/><rect x="29.5" y="40.5" width="3" height="7.5" rx=".6"/><rect x="34" y="38" width="3" height="10" rx=".6"/></g><rect x="22" y="35.5" width="17.5" height="14" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="1.5 1.5"/><rect x="38.2" y="34.2" width="2.6" height="2.6" fill="#fff" stroke="#2563eb" stroke-width="1"/><rect x="20.7" y="48.2" width="2.6" height="2.6" fill="#fff" stroke="#2563eb" stroke-width="1"/></svg>
    <span>DdDesignReport</span>
  </div>
  <button id="new" type="button" data-t>New</button>
  <select id="templates" aria-label="Start from a ready-made template"><option value="" data-t>Templates…</option></select>
  <button id="open" type="button" data-t>Open…</button>
  <button id="save" type="button" class="primary" data-t>Save template</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <div class="seg" role="group" aria-label="Export">
    <span data-t>Export</span>
    <button type="button" data-export="pdf">PDF</button>
    <button type="button" data-export="html">HTML</button>
    <button type="button" data-export="xlsx">XLSX</button>
    <button type="button" data-export="xls">XLS</button>
    <button type="button" data-export="csv">CSV</button>
  </div>
  <button id="datatoggle" type="button" aria-expanded="false" aria-controls="datapanel" data-t>Sample data</button>
  <label class="switch" title="Fewer tools, each with its name"><input id="simple" type="checkbox"> <span data-t>Simple mode</span></label>
  <span class="spacer"></span>
  <a id="lang" href="?lang=id">Bahasa Indonesia</a>
</header>
<details id="datapanel">
  <summary data-t>Sample data</summary>
  <div>
    <label for="data" data-t>Sample data for preview and export (JSON)</label>
    <p data-t>The fields here are what the {{placeholders}} in the report are filled with.</p>
    <textarea id="data" spellcheck="false"></textarea>
  </div>
</details>
<output id="msg" role="status"></output>
<div id="designer"></div>
<script type="module">
import { createDesigner } from './designer.js'

// ?lang=id switches the whole page to Indonesian
const lang = new URLSearchParams(location.search).get('lang') === 'id' ? 'id' : 'en'
const NO_SERVER = 'Preview and export need this page to be opened from `ddreport -serve`, which does the rendering.'
const ID = {
  [NO_SERVER]: 'Pratinjau dan ekspor butuh halaman ini dibuka dari `ddreport -serve`, yang melakukan pencetakan.',
  'New': 'Baru', 'Templates…': 'Template…', 'Open…': 'Buka…', 'Save template': 'Simpan template', 'Export': 'Ekspor',
  'Sample data for preview and export (JSON)': 'Data contoh untuk pratinjau dan ekspor (JSON)', 'Sample data': 'Data contoh',
  'The fields here are what the {{placeholders}} in the report are filled with.': 'Field di sini adalah isi untuk {{placeholder}} di laporan.',
  'Sample data is not valid JSON: ': 'Data contoh bukan JSON yang sah: ',
  'Could not load the template: ': 'Template tidak bisa dimuat: ', 'Not a valid template: ': 'Bukan template yang sah: ', 'Export failed: ': 'Ekspor gagal: ',
  'Replaced. Ctrl+Z or the Undo button brings the previous report back.': 'Diganti. Ctrl+Z atau tombol Urungkan mengembalikan laporan sebelumnya.',
  'Could not save in this browser (storage is full or blocked). Use "Save template" to keep your work.': 'Tidak bisa menyimpan di browser ini (penyimpanan penuh atau diblokir). Pakai "Simpan template" agar pekerjaan tidak hilang.',
  'Simple mode': 'Mode mudah', 'Fewer tools, each with its name': 'Lebih sedikit alat, masing-masing dengan namanya',
}
const L = s => (lang === 'id' && ID[s]) || s
document.documentElement.lang = lang
for (const el of document.querySelectorAll('[data-t]')) el.textContent = L(el.textContent)
if (lang === 'id') Object.assign(document.getElementById('lang'), { href: '?', textContent: 'English' })

const KEY = 'ddreport-template', DATA = 'ddreport-data', $ = id => document.getElementById(id)
// messages show for a few seconds at the bottom of the window
let hide
const say = text => { $('msg').value = text; clearTimeout(hide); if (text) hide = setTimeout(() => { $('msg').value = '' }, 7000) }
$('datatoggle').onclick = () => { $('datapanel').open = !$('datapanel').open; $('datatoggle').setAttribute('aria-expanded', $('datapanel').open) }
// a template with large pictures can be more than the browser will store: say so instead of losing it quietly
const store = (k, v) => {
  try { localStorage.setItem(k, v); return true }
  catch { say(L('Could not save in this browser (storage is full or blocked). Use "Save template" to keep your work.')); return false }
}
const stored = k => { try { return localStorage.getItem(k) } catch { return null } }
const persist = t => store(KEY, JSON.stringify(t))
let saved
try { saved = JSON.parse(stored(KEY)) } catch {}

$('data').value = stored(DATA) ?? JSON.stringify({
  title: 'Sales',
  rows: [
    { category: 'Drinks', name: 'Coffee', qty: 2, price: 18000 },
    { category: 'Drinks', name: 'Tea', qty: 1, price: 12000 },
    { category: 'Food', name: 'Fried rice', qty: 3, price: 25000 },
  ],
}, null, 2)
$('data').oninput = () => { store(DATA, $('data').value); designer.setFields(fieldNames()); designer.setData(sample()) }

// the sample data, for the charts drawn on the page; nothing while it is not valid JSON
function sample() {
  try { return JSON.parse($('data').value) } catch { return undefined }
}

// the field names in the sample data, for the designer's Field menu: the
// report's own fields (customer.name) and those of its rows
function fieldNames() {
  let data
  try { data = JSON.parse($('data').value) } catch { return [] }
  const names = new Set()
  const walk = (obj, prefix) => {
    for (const [k, v] of Object.entries(obj ?? {})) {
      if (Array.isArray(v)) for (const row of v.slice(0, 50)) { if (row && typeof row === 'object') Object.keys(row).forEach(n => names.add(n)) }
      else if (v && typeof v === 'object') walk(v, prefix + k + '.')
      else names.add(prefix + k)
    }
  }
  walk(Array.isArray(data) ? { rows: data } : data, '')
  return [...names]
}

// rendering works when this page is served by `ddreport -serve`
async function render(template, format) {
  let data
  try { data = JSON.parse($('data').value || 'null') } catch (err) { throw new Error(L('Sample data is not valid JSON: ') + err.message) }
  let res
  // a server with DDREPORT_TOKEN wants it: open the page as /#token=...
  const token = new URLSearchParams(location.hash.slice(1)).get('token')
  const headers = token ? { Authorization: 'Bearer ' + token } : {}
  try { res = await fetch('render?format=' + format, { method: 'POST', headers, body: JSON.stringify({ template, data }) }) }
  catch { throw new Error(L(NO_SERVER)) }
  // a plain file server has no /render and answers with a page of its own
  if (res.status === 404 || res.status === 405 || res.status === 501) throw new Error(L(NO_SERVER))
  if (!res.ok) throw new Error(await res.text())
  return res
}

function download(blob, name) {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = name
  a.click()
  URL.revokeObjectURL(a.href)
}

// simple mode, on until it is turned off: fewer tools, each with its name. Switching keeps the report.
const SIMPLE = 'ddreport-simple'
$('simple').checked = stored(SIMPLE) !== 'off'
$('simple').parentNode.title = L($('simple').parentNode.title)
let designer
function make() {
  const template = designer?.getTemplate() ?? saved ?? undefined
  designer?.destroy()
  designer = createDesigner($('designer'), {
    lang,
    theme: 'auto',
    simple: $('simple').checked,
    fontBase: 'fonts/', // served by ddreport -serve
    fields: fieldNames(),
    data: sample(),
    template,
    onChange: persist,
    preview: async template => (await render(template, 'html')).text(),
  })
}
make()
$('simple').onchange = () => { store(SIMPLE, $('simple').checked ? 'on' : 'off'); make() }
// replacing the report is one undo step in the designer, so nothing is lost for good
const replace = t => {
  designer.setTemplate(t)
  if (persist(designer.getTemplate())) say(L('Replaced. Ctrl+Z or the Undo button brings the previous report back.'))
}

$('new').onclick = () => replace()

// ready-made templates, each with its own sample data
fetch('templates/index.json').then(r => r.json()).then(list => {
  $('templates').append(...list.map(t => Object.assign(new Option(t.name, t.id), { title: t.description })))
}).catch(() => { $('templates').hidden = true })
$('templates').onchange = async () => {
  const id = $('templates').value
  $('templates').value = ''
  if (!id) return
  try {
    const { template, data } = await (await fetch(`templates/${id}.json`)).json()
    replace(template)
    $('data').value = JSON.stringify(data, null, 2)
    store(DATA, $('data').value)
    designer.setFields(fieldNames())
    designer.setData(sample())
  } catch (err) { say(L('Could not load the template: ') + err.message) }
}
$('open').onclick = () => $('file').click()
$('file').onchange = async () => {
  try { replace(JSON.parse(await $('file').files[0].text())) }
  catch (err) { say(L('Not a valid template: ') + err.message) }
  $('file').value = ''
}
$('save').onclick = () => download(new Blob([JSON.stringify(designer.getTemplate(), null, 2)], { type: 'application/json' }), 'report.json')
for (const button of document.querySelectorAll('[data-export]')) {
  button.onclick = async () => {
    const format = button.dataset.export
    say('')
    try { download(await (await render(designer.getTemplate(), format)).blob(), 'report.' + format) }
    catch (err) { say(L('Export failed: ') + err.message) }
  }
}
</script>
</body>
</html>
