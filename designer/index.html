<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DdDesignReport Designer</title>
<style>
  html, body { height: 100%; margin: 0 }
  body { display: flex; flex-direction: column; background: #f3f3f3; color: #111; font: 13px system-ui, sans-serif }
  header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; background: #fff; border-bottom: 1px solid #c8c8c8 }
  header strong { margin-right: 8px }
  header span { margin-left: 12px; color: #666 }
  header a { margin-left: auto; color: #185abd }
  #msg { color: #a12a00 }
  details { padding: 6px 10px; background: #fff; border-bottom: 1px solid #c8c8c8 }
  textarea { display: block; width: min(100%, 700px); height: 140px; margin-top: 6px; font: 12px monospace }
  #designer { flex: 1; min-height: 0; border: 0 }
  #designer .ddr-work { flex: 1 }
</style>
</head>
<body>
<header>
  <strong>DdDesignReport</strong>
  <button id="new" type="button" data-t>New</button>
  <select id="templates" aria-label="Start from a ready-made template"><option value="" data-t>Templates…</option></select>
  <button id="open" type="button" data-t>Open…</button>
  <button id="save" type="button" data-t>Save template</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <span data-t>Export</span>
  <button type="button" data-export="pdf">PDF</button>
  <button type="button" data-export="html">HTML</button>
  <button type="button" data-export="xlsx">XLSX</button>
  <button type="button" data-export="xls">XLS</button>
  <button type="button" data-export="csv">CSV</button>
  <output id="msg" role="status"></output>
  <a id="lang" href="?lang=id">Bahasa Indonesia</a>
</header>
<details>
  <summary><label for="data" data-t>Sample data for preview and export (JSON)</label></summary>
  <textarea id="data" spellcheck="false"></textarea>
</details>
<div id="designer"></div>
<script type="module">
import { createDesigner } from './designer.js'

// ?lang=id switches the whole page to Indonesian
const lang = new URLSearchParams(location.search).get('lang') === 'id' ? 'id' : 'en'
const ID = {
  'New': 'Baru', 'Templates…': 'Template…', 'Open…': 'Buka…', 'Save template': 'Simpan template', 'Export': 'Ekspor',
  'Sample data for preview and export (JSON)': 'Data contoh untuk pratinjau dan ekspor (JSON)',
  'Sample data is not valid JSON: ': 'Data contoh bukan JSON yang sah: ',
  'Could not load the template: ': 'Template tidak bisa dimuat: ', 'Not a valid template: ': 'Bukan template yang sah: ', 'Export failed: ': 'Ekspor gagal: ',
  'Replaced. Ctrl+Z or the Undo button brings the previous report back.': 'Diganti. Ctrl+Z atau tombol Urungkan mengembalikan laporan sebelumnya.',
  'Could not save in this browser (storage is full or blocked). Use "Save template" to keep your work.': 'Tidak bisa menyimpan di browser ini (penyimpanan penuh atau diblokir). Pakai "Simpan template" agar pekerjaan tidak hilang.',
}
const L = s => (lang === 'id' && ID[s]) || s
document.documentElement.lang = lang
for (const el of document.querySelectorAll('[data-t]')) el.textContent = L(el.textContent)
if (lang === 'id') Object.assign(document.getElementById('lang'), { href: '?', textContent: 'English' })

const KEY = 'ddreport-template', DATA = 'ddreport-data', $ = id => document.getElementById(id)
const say = text => { $('msg').value = text }
// a template with large pictures can be more than the browser will store: say so instead of losing it quietly
const store = (k, v) => {
  try { localStorage.setItem(k, v); return true }
  catch { say(L('Could not save in this browser (storage is full or blocked). Use "Save template" to keep your work.')); return false }
}
const stored = k => { try { return localStorage.getItem(k) } catch { return null } }
const persist = t => store(KEY, JSON.stringify(t))
let saved
try { saved = JSON.parse(stored(KEY)) } catch {}

$('data').value = stored(DATA) ?? JSON.stringify({
  title: 'Sales',
  rows: [
    { category: 'Drinks', name: 'Coffee', qty: 2, price: 18000 },
    { category: 'Drinks', name: 'Tea', qty: 1, price: 12000 },
    { category: 'Food', name: 'Fried rice', qty: 3, price: 25000 },
  ],
}, null, 2)
$('data').oninput = () => store(DATA, $('data').value)

// rendering works when this page is served by `ddreport -serve`
async function render(template, format) {
  let data
  try { data = JSON.parse($('data').value || 'null') } catch (err) { throw new Error(L('Sample data is not valid JSON: ') + err.message) }
  const res = await fetch('render?format=' + format, { method: 'POST', body: JSON.stringify({ template, data }) })
  if (!res.ok) throw new Error(await res.text())
  return res
}

function download(blob, name) {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = name
  a.click()
  URL.revokeObjectURL(a.href)
}

const designer = createDesigner($('designer'), {
  lang,
  template: saved ?? undefined,
  onChange: persist,
  preview: async template => (await render(template, 'html')).text(),
})
// replacing the report is one undo step in the designer, so nothing is lost for good
const replace = t => {
  designer.setTemplate(t)
  if (persist(designer.getTemplate())) say(L('Replaced. Ctrl+Z or the Undo button brings the previous report back.'))
}

$('new').onclick = () => replace()

// ready-made templates, each with its own sample data
fetch('templates/index.json').then(r => r.json()).then(list => {
  $('templates').append(...list.map(t => Object.assign(new Option(t.name, t.id), { title: t.description })))
}).catch(() => { $('templates').hidden = true })
$('templates').onchange = async () => {
  const id = $('templates').value
  $('templates').value = ''
  if (!id) return
  try {
    const { template, data } = await (await fetch(`templates/${id}.json`)).json()
    replace(template)
    $('data').value = JSON.stringify(data, null, 2)
    store(DATA, $('data').value)
  } catch (err) { say(L('Could not load the template: ') + err.message) }
}
$('open').onclick = () => $('file').click()
$('file').onchange = async () => {
  try { replace(JSON.parse(await $('file').files[0].text())) }
  catch (err) { say(L('Not a valid template: ') + err.message) }
  $('file').value = ''
}
$('save').onclick = () => download(new Blob([JSON.stringify(designer.getTemplate(), null, 2)], { type: 'application/json' }), 'report.json')
for (const button of document.querySelectorAll('[data-export]')) {
  button.onclick = async () => {
    const format = button.dataset.export
    say('')
    try { download(await (await render(designer.getTemplate(), format)).blob(), 'report.' + format) }
    catch (err) { say(L('Export failed: ') + err.message) }
  }
}
</script>
</body>
</html>
